name: Run (Intel) MPAS Standalone

on: [push,pull_request,workflow_dispatch]

jobs:
  run_mpas_intel:

    # The type of runner that the job will run on
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false  # Disable fail-fast
      matrix:
        fortran-compiler: [intel]
        build-system:     [make]
        py-version:       [3.11]

    # Environmental variables
    env:
      mpas_rt_ROOT: /home/runner/work/MPAS-Model
      mpas_bl_ROOT: /home/runner
      AUTOCONF_VERSION: 2.71
      AUTOMAKE_VERSION: 1.17
      M4_VERSION: 1.4.19
      LIBTOOL_VERSION: 2.5.4
      PNETCDF: /home/runner/PnetCDF
      AUTOTOOLS: /home/runner/AUTOTOOLS
      OMPI: /opt/intel/oneapi/mpi/2021.10.0
      MPAS_case:      ncar-v8.3.0-intelmpi
      MPAS_codebase:  ncar
      MPAS_namelist:  ncar
      MPAS_source:    gfs
      MPAS_domain:    conus
      MPAS_res:       120
      MPAS_timestamp: 2023031015
      MPAS_nproc:     2

    # Workflow steps
    steps:

    ##########################################################################################
    # Build Software Stack needed for MPAS on GitHub server, using Intel package created and
    # cached by NOAA-EMC.
    # NOTE: This is fine for the time being, but this whole block of the workflow could(should)
    #       be replace with containers that we can maintain/update w/ new compilers.
    ##########################################################################################
    - name: "Install Intel compilers & MPI"
      uses: NOAA-EMC/ci-install-intel-toolkit@develop
      with:
        install-mpi: true

    - name: Cache Intel
      id: cache-INTEL
      uses: actions/cache@v4
      with:
        path: /opt/intel/oneapi/mpi/2021.10.0
        key: cache-AUTOTOOLS-${{matrix.fortran-compiler}}-key

    - name: Install NetCDF library
      run: |
        sudo apt-get update
        sudo apt-get install libnetcdff-dev

    - name: Cache GNU autotools
      id: cache-AUTOTOOLS
      uses: actions/cache@v4
      with:
        path: /home/runner/AUTOTOOLS
        key: cache-AUTOTOOLS-${{matrix.fortran-compiler}}-key

    - name: Build GNU autotools
      if: steps.cache-AUTOTOOLS.outputs.cache-hit != 'true'
      run: |
        wget -q https://ftp.gnu.org/gnu/m4/m4-${M4_VERSION}.tar.gz
        gzip -dc m4-${M4_VERSION}.tar.gz | tar -xf -
        cd m4-${M4_VERSION}
        ./configure --prefix=${AUTOTOOLS} --silent
        make -s -j 8 install > qout 2>&1
        make -s -j 8 distclean >> qout 2>&1

        wget -q https://ftp.gnu.org/gnu/autoconf/autoconf-${AUTOCONF_VERSION}.tar.gz
        gzip -dc autoconf-${AUTOCONF_VERSION}.tar.gz | tar -xf -
        cd autoconf-${AUTOCONF_VERSION}
        ./configure --prefix=${AUTOTOOLS} --silent
        make -s -j 8 install > qout 2>&1
        make -s -j 8 distclean >> qout 2>&1

        wget -q https://ftp.gnu.org/gnu/automake/automake-${AUTOMAKE_VERSION}.tar.gz
        gzip -dc automake-${AUTOMAKE_VERSION}.tar.gz | tar -xf -
        cd automake-${AUTOMAKE_VERSION}
        ./configure --prefix=${AUTOTOOLS} --silent
        make -s -j 8 install > qout 2>&1
        make -s -j 8 distclean >> qout 2>&1

        wget -q https://ftp.gnu.org/gnu/libtool/libtool-${LIBTOOL_VERSION}.tar.gz
        gzip -dc libtool-${LIBTOOL_VERSION}.tar.gz | tar -xf -
        cd libtool-${LIBTOOL_VERSION}
        ./configure --prefix=${AUTOTOOLS} --silent
        make -s -j 8 install > qout 2>&1
        make -s -j 8 distclean >> qout 2>&1
        echo "LD_LIBRARY_PATH=${AUTOTOOLS}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PATH=${AUTOTOOLS}/bin:$PATH" >> $GITHUB_ENV

    - name: Cache PnetCDF
      id: cache-pnetcdf
      uses: actions/cache@v4
      with:
        path: /home/runner/PnetCDF
        key: cache-PnetCDF-${{matrix.fortran-compiler}}-key

    - name: Install PnetCDF
      if: steps.cache-PnetCDF.outputs.cache-hit != 'true'
      run: |
        set -x
        echo "LD_LIBRARY_PATH=${AUTOTOOLS}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PATH=${AUTOTOOLS}/bin:$PATH" >> $GITHUB_ENV
        m4 --version
        autoconf --version
        automake --version
        libtool --version
        echo "Install PnetCDF on ${PNETCDF}"
        rm -rf PnetCDF ; mkdir PnetCDF ; cd PnetCDF
        git clone -q https://github.com/Parallel-NetCDF/PnetCDF.git
        cd PnetCDF
        autoreconf -i
        ./configure --prefix=${PNETCDF} --with-mpi=${OMPI}
        make -j 8 install
        echo "PATH=${PNETCDF}/bin:$PATH" >> $GITHUB_ENV

    - name: Setup environment
      run: |
        echo "FC=mpiifort" >> $GITHUB_ENV
        echo "CC=mpiicc"   >> $GITHUB_ENV
        echo "PNETCDF=${PNETCDF}" >> $GITHUB_ENV
        echo "PATH=${AUTOTOOLS}/bin:$PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=${AUTOTOOLS}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PATH=${PNETCDF}/bin:$PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=${PNETCDF}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

    ##########################################################################################
    # Compile MPAS for testing.
    # When generating new baselines, checkout the gsl/develop branch from the ufs-community 
    # fork of MPAS-A and also compile MPAS from this branch
    ##########################################################################################
    - name: Cache MPAS standalone needed to generate baselines
      id: cache-mpas-bl
      uses: actions/cache@v4
      with:
        path: /home/runner/MPAS-Model-BL
        key: cache-mpas-bl-${{matrix.fortran-compiler}}-key

    - name: Checkout and build MPAS standalone for baseline generation.
      if: steps.cache-mpas-bl.outputs.cache-hit != 'true'
      run: |
        cd ${mpas_bl_ROOT}
        git clone --recursive --branch gsl/develop https://github.com/ufs-community/MPAS-Model.git MPAS-Model-BL
        cd ${mpas_bl_ROOT}/MPAS-Model-BL
        make intel-mpi CORE=atmosphere DEBUG=true
        pwd
        ls -l ${mpas_bl_ROOT}
        pwd
        ls -l ${mpas_bl_ROOT}/MPAS-Model-BL

#    - name: Checkout MPAS codebase for testing.
#      uses: actions/checkout@v3
#
#    - name: Initialize any submodules from testing codebase.
#      run: |
#        git submodule update --init --recursive
#
#    - name: Build MPAS standalone for testing
#      run: |
#        cd ${mpas_rt_ROOT}/MPAS-Model
#        make intel-mpi CORE=atmosphere DEBUG=true

    ##########################################################################################
    # Configure and run MPAS.
    # Run twice. Once to create the baseline results using the gsl/develop branch, and again
    # using the feature branch.
    ##########################################################################################
    - name: Download required MPAS data
      run: |
        wget https://gsl.noaa.gov/thredds/catalog/retro/barlage/mpas_test_data/grid/${MPAS_domain}.${MPAS_res}km.graph.info.part.${MPAS_nproc}
        wget -e robots=off -nH --cut-dirs N -nc -r -lX -A '*' -R 'catalog*' -I /thredds/fileServer/,/thredds/catalog/ https://gsl.noaa.gov/thredds/catalog/retro/barlage/mpas_test_data/run_case_input/create_case_output/${MPAS_case}/${MPAS_namelist}.${MPAS_codebase}.${MPAS_domain}.${MPAS_res}km.${MPAS_source}.${MPAS_timestamp}/case_files/catalog.html
        mv thredds/catalog/retro/barlage/mpas_test_data/run_case_input/create_case_output/${MPAS_case}/${MPAS_namelist}.${MPAS_codebase}.${MPAS_domain}.${MPAS_res}km.${MPAS_source}.${MPAS_timestamp}/case_files/ .
        #wget -e robots=off -nH --cut-dirs N -nc -r -lX -A '*' -R 'catalog*' -I /thredds/fileServer/,/thredds/catalog/ 'https://gsl.noaa.gov/thredds/catalog/retro/barlage/mpas_test_data/run_case_input/create_case_output/ncar-v8.2.2-intelmpi/ncar.ncar.conus.120km.gfs.2023031015/case_files/catalog.html'

        pwd
        ls -l

    - name: Download MPAS testing repository with runtime configurations.
      run: |
        git clone --recursive --branch main https://github.com/barlage/mpas_testcase.git
        pwd
        ls -l mpas_testcase

    - name: Run MPAS (baseline branch)
      run: |
        pwd
        ls -l
 
    - name: Run MPAS (feature branch)
      run: |
        pwd
        ls -l

    ##########################################################################################
    # Compare feature branch to baseline branch.
    ##########################################################################################
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{matrix.py-version}}

    - name: Install NetCDF Python libraries
      run: |
        pip install f90nml h5py netCDF4 matplotlib