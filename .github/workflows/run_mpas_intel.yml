name: Run (Intel) MPAS Standalone

on: [push,pull_request,workflow_dispatch]

jobs:
  run_mpas_intel:

    # The type of runner that the job will run on
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false  # Disable fail-fast
      matrix:
        fortran-compiler: [intel]
        build-system:     [make]
        py-version:       [3.11]

    # Environmental variables
    env:
      runner_ROOT:   /home/runner
      mpas_rt_ROOT:  /home/runner/work/MPAS-Model
      mpas_bl_ROOT:  /home/runner/MPAS-Model-BL
      mpas_run_ROOT: /home/runner/work
      AUTOCONF_VERSION: 2.71
      AUTOMAKE_VERSION: 1.17
      M4_VERSION: 1.4.19
      LIBTOOL_VERSION: 2.5.4
      PNETCDF: /home/runner/PnetCDF
      AUTOTOOLS: /home/runner/AUTOTOOLS
      OMPI: /opt/intel/oneapi/mpi/2021.10.0
      grid_dir:          thredds/catalog/retro/barlage/mpas_test_data/grid
      case_dir:          retro/barlage/mpas_test_data/run_case_input/create_case_output
      nml_version:       ncar
      case_base:         ncar-v8.2.2-intelmpi
      model_code_base:   gsl-v8.3.0-1.8-intdebug
      physics:           mesoscale_reference
      code_base:         ncar
      nml:               ncar
      source:            gfs
      domain:            conus
      res:               120
      exec:              atmosphere_model
      nproc:             2
      yyyy:              "2023"
      mm:                "03"
      dd:                "10"
      hh:                "15"

    # Workflow steps
    steps:

    ##########################################################################################
    # Build Software Stack needed for MPAS on GitHub server, using Intel package created and
    # cached by NOAA-EMC.
    # NOTE: This is fine for the time being, but this whole block of the workflow could(should)
    #       be replace with containers that we can maintain/update w/ new compilers.
    ##########################################################################################
    - name: "Install Intel compilers & MPI"
      uses: NOAA-EMC/ci-install-intel-toolkit@develop
      with:
        install-mpi: true

    - name: Cache Intel
      id: cache-INTEL
      uses: actions/cache@v4
      with:
        path: /opt/intel/oneapi/mpi/2021.10.0
        key: cache-AUTOTOOLS-${{matrix.fortran-compiler}}-key

    - name: Install NetCDF library
      run: |
        sudo apt-get update
        sudo apt-get install libnetcdff-dev

    - name: Cache GNU autotools
      id: cache-AUTOTOOLS
      uses: actions/cache@v4
      with:
        path: /home/runner/AUTOTOOLS
        key: cache-AUTOTOOLS-${{matrix.fortran-compiler}}-key

    - name: Build GNU autotools
      if: steps.cache-AUTOTOOLS.outputs.cache-hit != 'true'
      run: |
        wget -q https://ftp.gnu.org/gnu/m4/m4-${M4_VERSION}.tar.gz
        gzip -dc m4-${M4_VERSION}.tar.gz | tar -xf -
        cd m4-${M4_VERSION}
        ./configure --prefix=${AUTOTOOLS} --silent
        make -s -j 8 install > qout 2>&1
        make -s -j 8 distclean >> qout 2>&1

        wget -q https://ftp.gnu.org/gnu/autoconf/autoconf-${AUTOCONF_VERSION}.tar.gz
        gzip -dc autoconf-${AUTOCONF_VERSION}.tar.gz | tar -xf -
        cd autoconf-${AUTOCONF_VERSION}
        ./configure --prefix=${AUTOTOOLS} --silent
        make -s -j 8 install > qout 2>&1
        make -s -j 8 distclean >> qout 2>&1

        wget -q https://ftp.gnu.org/gnu/automake/automake-${AUTOMAKE_VERSION}.tar.gz
        gzip -dc automake-${AUTOMAKE_VERSION}.tar.gz | tar -xf -
        cd automake-${AUTOMAKE_VERSION}
        ./configure --prefix=${AUTOTOOLS} --silent
        make -s -j 8 install > qout 2>&1
        make -s -j 8 distclean >> qout 2>&1

        wget -q https://ftp.gnu.org/gnu/libtool/libtool-${LIBTOOL_VERSION}.tar.gz
        gzip -dc libtool-${LIBTOOL_VERSION}.tar.gz | tar -xf -
        cd libtool-${LIBTOOL_VERSION}
        ./configure --prefix=${AUTOTOOLS} --silent
        make -s -j 8 install > qout 2>&1
        make -s -j 8 distclean >> qout 2>&1
        echo "LD_LIBRARY_PATH=${AUTOTOOLS}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PATH=${AUTOTOOLS}/bin:$PATH" >> $GITHUB_ENV

    - name: Cache PnetCDF
      id: cache-pnetcdf
      uses: actions/cache@v4
      with:
        path: /home/runner/PnetCDF
        key: cache-PnetCDF-${{matrix.fortran-compiler}}-key

    - name: Install PnetCDF
      if: steps.cache-PnetCDF.outputs.cache-hit != 'true'
      run: |
        set -x
        echo "LD_LIBRARY_PATH=${AUTOTOOLS}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PATH=${AUTOTOOLS}/bin:$PATH" >> $GITHUB_ENV
        m4 --version
        autoconf --version
        automake --version
        libtool --version
        echo "Install PnetCDF on ${PNETCDF}"
        rm -rf PnetCDF ; mkdir PnetCDF ; cd PnetCDF
        git clone -q https://github.com/Parallel-NetCDF/PnetCDF.git
        cd PnetCDF
        autoreconf -i
        ./configure --prefix=${PNETCDF} --with-mpi=${OMPI}
        make -j 8 install
        echo "PATH=${PNETCDF}/bin:$PATH" >> $GITHUB_ENV

    - name: Setup environment
      run: |
        echo "FC=mpiifort" >> $GITHUB_ENV
        echo "CC=mpiicc"   >> $GITHUB_ENV
        echo "PNETCDF=${PNETCDF}" >> $GITHUB_ENV
        echo "PATH=${AUTOTOOLS}/bin:$PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=${AUTOTOOLS}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PATH=${PNETCDF}/bin:$PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=${PNETCDF}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

    ##########################################################################################
    # Compile MPAS for testing "feature" branch.
    # When generating new baselines, checkout the gsl/develop branch from the ufs-community 
    # fork of MPAS-A and re-compile.
    # $model_base_directory = 
    ##########################################################################################
    - name: Set variables
      id: set_vars
      run: |
        echo "datestring=${yyyy}'-'${mm}'-'${dd}'_'${hh}'.00.00'" >> $GITHUB_OUTPUT
        echo "input_case_directory=${code_base}.${nml}.${domain}.${res}km.${source}.${yyyy}'-'${mm}'-'${dd}'_'${hh}'.00.00'" >> $GITHUB_OUTPUT
        echo "static_file=mpas.${code_base}.${nml}.${domain}.${res}km.static.nc" >> $GITHUB_OUTPUT
        echo "init_file=mpas.${code_base}.${nml}.${domain}.${res}km.${source}.init.${yyyy}'-'${mm}'-'${dd}'_'${hh}'.00.00'.nc" >> $GITHUB_OUTPUT
        echo "lbc_file=mpas.${code_base}.${nml}.${domain}.${res}km.${source}.lbc.${yyyy}'-'${mm}'-'${dd}'_'${hh}'.00.00'.nc" >> $GITHUB_OUTPUT
        echo "sst_file=mpas.${code_base}.${nml}.${domain}.${res}km.${source}.sfc_update.${yyyy}'-'${mm}'-'${dd}'_'${hh}'.00.00'.nc" >> $GITHUB_OUTPUT
        echo "ugwp_file=mpas.${code_base}.${nml}.${domain}.${res}km.ugwp_oro_data.nc" >> $GITHUB_OUTPUT

    - name: Display configuration
      run: |
        echo ${{steps.set_vars.outputs.datestring}}
        echo ${{steps.set_vars.outputs.input_case_directory}}
        echo ${{steps.set_vars.outputs.static_file}}
        echo ${{steps.set_vars.outputs.init_file}}
        echo ${{steps.set_vars.outputs.lbc_file}}
        echo ${{steps.set_vars.outputs.sst_file}}
        echo ${{steps.set_vars.outputs.ugwp_file}}

    - name: Cache MPAS standalone needed to generate baselines
      id: cache-mpas-bl
      uses: actions/cache@v4
      with:
        path: /home/runner/MPAS-Model-BL
        key: cache-mpas-bl-${{matrix.fortran-compiler}}-key

    - name: Checkout and build MPAS standalone for baseline generation.
      if: steps.cache-mpas-bl.outputs.cache-hit != 'true'
      run: |
        cd ${runner_ROOT}
        git clone --recursive --branch gsl/develop https://github.com/ufs-community/MPAS-Model.git MPAS-Model-BL
        cd ${mpas_bl_ROOT}
        make intel-mpi CORE=atmosphere DEBUG=true
        pwd
        ls -l ${runner_ROOT}
        pwd
        ls -l ${mpas_bl_ROOT}

#    - name: Checkout MPAS codebase for testing.
#      uses: actions/checkout@v3
#
#    - name: Initialize any submodules from testing codebase.
#      run: |
#        git submodule update --init --recursive
#
#    - name: Build MPAS standalone for testing
#      run: |
#        cd ${mpas_rt_ROOT}/MPAS-Model
#        make intel-mpi CORE=atmosphere DEBUG=true

    ##########################################################################################
    # Fetch any data/files needed for MPAS runs.
    ##########################################################################################
    - name: Download MPAS data (grid info, IC and LBC files)
      run: |
        cd ${mpas_run_ROOT} && mkdir run_data && cd run_data
        wget -q https://gsl.noaa.gov/${grid_dir}/${domain}.${res}km.graph.info.part.${nproc}
        wget -q -e robots=off -nH --cut-dirs N -nc -r -lX -A '*' -R 'catalog*' -I /thredds/fileServer/,/thredds/catalog/ \
        https://gsl.noaa.gov/thredds/catalog/${case_dir}/${case_base}/${nml}.${code_base}.${domain}.${res}km.${source}.${yyyy}${mm}${dd}${hh}/case_files/catalog.html
        mv thredds/fileServer/${case_dir}/${case_base}/${nml}.${code_base}.${domain}.${res}km.${source}.${yyyy}${mm}${dd}${hh}/case_files/* .
        rm -rf thredds
        pwd
        ls -l

    - name: Download MPAS testing repository with runtime configurations.
      run: |
        cd ${mpas_run_ROOT}
        git clone --recursive --branch main https://github.com/barlage/mpas_testcase.git
        pwd
        ls -l
        pwd
        ls -l mpas_testcase

    ##########################################################################################
    # Configure MPAS baseline runs
    ##########################################################################################
    - name: Create and populate run directory (baselines)
      run: |
        cd ${mpas_run_ROOT} && mkdir run_bl && cd run_bl
        cp ${mpas_run_ROOT}/mpas_testcase/case_files/${nml_version}/${domain}/${source}.${yyyy}${mm}${dd}${hh}/${physics}/* .
        ln -sf ${mpas_bl_ROOT}/src/core_atmosphere/physics/physics_wrf/files/*.TBL .
        ln -sf ${mpas_bl_ROOT}/src/core_atmosphere/physics/physics_wrf/files/*.DBL .
        ln -sf ${mpas_bl_ROOT}/src/core_atmosphere/physics/physics_wrf/files/*DATA .
        ln -sf ${mpas_bl_ROOT}/src/core_atmosphere/physics/physics_noahmp/parameters/NoahmpTable.TBL .
        ln -sf ${mpas_run_ROOT}/run_data/${{steps.set_vars.outputs.init_file}} mpas.init.nc
        ln -sf ${mpas_run_ROOT}/run_data/${domain}.${res}km.graph.info.part.${nproc} graph.info.part.${nproc}
        ln -sf /home/runner/MPAS-Model-BL/${exec} atmosphere_model
        pwd && ls -l
        pwd && ls -ltr /home/runner/MPAS-Model-BL

    - name: Link lateral boundary condition file for regional MPAS.
      if: env.domain == 'conus'
      run: |
        cd ${mpas_run_ROOT}/run_bl
        ln -sf ${mpas_run_ROOT}/run_data/${{steps.set_vars.outputs.lbc_file}} mpas.lbc.nc
        pwd && ls -l

    - name: Link surface files
      if: env.source == 'gfs'
      run: |
        cd ${mpas_run_ROOT}/run_bl
        ln -sf ${mpas_run_ROOT}/run_data/${{steps.set_vars.outputs.sst_file}} mpas.sfc_update.nc
        pwd && ls -l

    - name: Link orography data
      if: env.nml_version == 'gsl'
      run: |
        cd ${mpas_run_ROOT}/run_bl
        ln -sf ${mpas_run_ROOT}/run_data/${{steps.set_vars.outputs.ugwp_file}} mpas.ugwp_oro_data.nc
        pwd && ls -l

    - name: Link TEMPO MP data tables to run directory
      if: env.physics == 'hrrrv5'
      run: |
        cd ${mpas_run_ROOT}/run_bl
        pwd && ls -l

    - name: Link Thompson MP data tables to run directory
      if: contains(env.physics, 'convection_permitting')
      run: |
        cd ${mpas_run_ROOT}/run_bl
        pwd && ls -l

    ##########################################################################################
    # Configure MPAS feature runs
    ##########################################################################################
    - name: Create and populate run directory (feature test)
      run: |
        cd ${mpas_run_ROOT} && mkdir run_rt && cd run_rt
        pwd && ls -l

    ##########################################################################################
    # Run MPAS
    ##########################################################################################
    - name: Run MPAS (baselines)
      run: |
        cd ${mpas_run_ROOT}/run_bl
        mpiexec -n ${nproc} ./atmosphere_model
        pwd && ls -l
 
    - name: Run MPAS (feature branch)
      run: |
        cd ${mpas_run_ROOT}/run_rt
        pwd && ls -l

    ##########################################################################################
    # Compare feature branch to baseline branch.
    ##########################################################################################
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{matrix.py-version}}

    - name: Install NetCDF Python libraries
      run: |
        pip install f90nml h5py netCDF4 matplotlib