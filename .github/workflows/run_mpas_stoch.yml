name: Run MPAS Standalone with Stochastic Physics (NOAA GSL HRRRv5 tests)

on: [push, pull_request, workflow_dispatch]
#on: workflow_dispatch

#############################################################################################
# Testing script/workflow for ufs-community fork of MPAS-Dev/MPAS-A.
#
# Description
#
# - Clone and build MPAS for baseline generation.
# - Clone and build MPAS for feature branch testing (against baselines).
# - Download any data (MP tables, MPAS ICs/LBCs/etc...).
# - Create/populate MPAS run directories.
# - Run MPAS using baseline codebase/configuration.
# - Run MPAS using feature branch.
# - Compare results.
# - Save output files to GitHub artifact (for comparision w/ inline/standaloen results)
#
# Comments:
# - The test build/run configurations matrix is described below.
# - This script uses a matrix run configuration with exclusions to achieve the desired "run list"
#
# Tests:
#        Baseline Codebase Repository:Branch  Physics   IC source   season   build-type
# 1/4)   ufs-community:noaa/develop           hrrrv5    gfs         winter   Release/Debug
# 2/5)   ufs-community:noaa/develop           hrrrv5    rap         summer   Release/Debug
# 3/6)   ufs-community:noaa/develop           hrrrv5    rap         winter   Release/Debug
#
#############################################################################################
jobs:
  run_mpas_stoch:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false  # Disable fail-fast
      matrix:
        f-compiler: [gfortran]#,ifx]
#        ic_source:  [gfs, rap]
        ic_source:  [gfs]
#        season:     [summer, winter]
        season:     [winter]
        build-type: [Release]
        exclude:
          - ic_source: gfs
            season: summer
        include:
        # Set container images for each compiler
        - f-compiler: gfortran
          bld_target: gfortran
          image: dustinswales/ufs-community-mpas-ci:gnu
#        - f-compiler: ifx
#          bld_target: intel
#          image: dustinswales/ufs-community-mpas-ci:oneapi
    container:
      image: ${{matrix.image}}
    # 
    defaults:
      run:
        shell: bash -el {0}

    # Environmental variables.  GitHub Actions automatically exports these to all shell
    # environments.
    env:
      physics:        hrrrv5
      py-version:     3.11
      runner_ROOT:    /__w/
      MPAS_ROOT:      /__w/MPAS-Model/MPAS-Model
      mpas_bl_ROOT:   /__w/MPAS-Model-BL
      PNETCDF:        /opt/pnetcdf
      ufs_community:  testing_and_setup/ufs-community

    # Workflow steps
    steps:
    ##########################################################################################
    # Setup
    ##########################################################################################
    - name: Set derived shell environment variables
      run: |
        # Define various (relative) directories for convenience.  These are all relative to
        # the MPAS-Model base directory.
        #
        # The wrf_phys_tables directory contains physics tables and other files specific to
        # WRF physics.
        echo "wrf_phys_tables=src/core_atmosphere/physics/physics_wrf/files" >> $GITHUB_ENV
        # The ufscmnty_cases directory contains MPAS configuration files for various CI test
        # cases.  These consist of MPAS namelists and stream definitions.
        echo "ufscmnty_cases=${ufs_community}/cases" >> $GITHUB_ENV
        # The ufscmnty_data directory contains the script (get_data.sh) that downloads into
        # subdirectories various files needed for running MPAS.  These include physics tables
        # specific to UFS physics parameterizations (as opposed to WRF physics), MPAS initial
        # and boundary conditions, and MPAS static files.
        ufscmnty_data="${ufs_community}/data"
        echo "ufscmnty_data=${ufscmnty_data}" >> $GITHUB_ENV
        # The ufs_phys_tables directory contains physics tables and other files specific to
        # ufs physics.
        echo "ufs_phys_tables=${ufscmnty_data}/tables" >> $GITHUB_ENV
        # The mpas_ics directory contains MPAS initial and boundary condition files and MPAS
        # static files.
        echo "mpas_ics=${ufscmnty_data}/ics" >> $GITHUB_ENV

    - name: Setup MPI (GNU)
      if: matrix.f-compiler == 'gfortran'
      run: |
        echo "CC=mpicc"   >> $GITHUB_ENV
        echo "CXX=mpicxx" >> $GITHUB_ENV
        echo "FC=mpif90"  >> $GITHUB_ENV

    - name: Install LAPACK/BLAS
      run: |
        apt-get update -y
        apt-get install -y liblapack-dev libblas-dev libnetcdff-dev

    - name: Setup NetCDF
      run: |
        NETCDF_DIR=/home/runner/NetCDF
        mkdir -p ${NETCDF_DIR}/lib ${NETCDF_DIR}/include
        for f in /usr/include/netcdf*.h /usr/include/netcdf*.inc /usr/include/netcdf*.mod; do
          [ -e "$f" ] && ln -sf "$f" ${NETCDF_DIR}/include/ || true
        done
        for f in /usr/lib/x86_64-linux-gnu/libnetcdf*.so; do
          [ -e "$f" ] && ln -sf "$f" ${NETCDF_DIR}/lib/ || true
        done
        echo "NETCDF=${NETCDF_DIR}" >> $GITHUB_ENV

    - name: Setup PnetCDF
      run: |
        echo "PNETCDF=/opt/pnetcdf"   >> $GITHUB_ENV

     ##########################################################################################
     # Clone and build the MPAS baseline branch.
     ##########################################################################################
    - name: Get SHA -- baseline branch
      id: baseline-sha
      run: |
        echo "sha=$(git ls-remote https://github.com/ufs-community/MPAS-Model.git noaa/develop | cut -f1)" >> $GITHUB_OUTPUT

    - name: Checkout MPAS -- baseline branch
      run: |
        cd ${runner_ROOT}
        git clone --recursive --branch noaa/develop https://github.com/ufs-community/MPAS-Model.git MPAS-Model-BL

    - name: Cache MPAS build -- baseline branch
      id: cache-bl
      uses: actions/cache@v3
      with:
        path: ${{env.mpas_bl_ROOT}}/atmosphere_model
        key: mpas-build-bl-${{runner.os}}-${{matrix.image}}-${{matrix.f-compiler}}-${{matrix.build-type}}-${{steps.baseline-sha.outputs.sha}}

    - name: Download physics tables -- baseline branch
      run: |
        cd ${mpas_bl_ROOT}/src/core_atmosphere/physics
        ./checkout_data_files.sh

    - name: Build MPAS -- baseline branch
      if: steps.cache-bl.outputs.cache-hit != 'true'
      run: |
        cd ${mpas_bl_ROOT}
        make ${{matrix.bld_target}} CORE=atmosphere ${{matrix.build-type == 'Debug' && 'DEBUG=true' || ''}}

    ##########################################################################################
    # Clone and build the MPAS feature branch.
    ##########################################################################################

    # actions/checkout@v3 is a standard GitHub Actions action that clones the repository that
    # triggered the workflow into the runner's workspace.  Specifically it:
    #
    #   1) Clones the feature branch (the one that was pushed or opened as a PR) into ${MPAS_ROOT}.
    #   2) Checks out the specific commit that triggered the workflow.
    #
    - name: Checkout MPAS -- feature branch
      uses: actions/checkout@v3

    - name: Initialize submodules -- feature branch
      run: |
        git config --global --add safe.directory ${MPAS_ROOT}
        cd ${MPAS_ROOT}
        git submodule update --init --recursive

    - name: Cache MPAS build -- feature branch
      id: cache-feature
      uses: actions/cache@v3
      with:
        path: ${{env.MPAS_ROOT}}/atmosphere_model
        key: mpas-build-${{runner.os}}-${{matrix.image}}-${{matrix.f-compiler}}-${{matrix.build-type}}-${{hashFiles('Makefile', 'src/**')}}

    - name: Download physics tables -- feature branch
      run: |
        cd ${MPAS_ROOT}/src/core_atmosphere/physics
        ./checkout_data_files.sh

    - name: Build MPAS -- feature branch
      if: steps.cache-feature.outputs.cache-hit != 'true'
      run: |
        cd ${MPAS_ROOT}
        make ${{matrix.bld_target}} CORE=atmosphere ${{matrix.build-type == 'Debug' && 'DEBUG=true' || ''}}

    ##########################################################################################
    # Download any data/files needed for MPAS runs.
    # Note that this step uses the get_data.sh script in the feature branch, assuming that
    # the data downloaded is also sufficient for runs with the baseline branch.
    ##########################################################################################
    - name: Download MPAS data (grid info, IC and LBC files, some larger physics tables)
      run: |
        #echo "0000000000"
        ${MPAS_ROOT}/${ufscmnty_data}/get_data.sh
        #set -x
        #echo "AAAAAAAAAA"
        #cd testing_and_setup
        #pwd
        #ls -alF
        #echo "BBBBBBBBBB"
        #cd ufs-community
        #pwd
        #ls -alF
        #echo "CCCCCCCCCC"
        #cd data
        #pwd
        #ls -alF
        #echo "DDDDDDDDDD"
        #cd ics
        #pwd
        #ls -alF
        #echo "EEEEEEEEEE"
        #cd ufscommunity.gfs.winter
        #pwd
        #ls -alF
        #echo "FFFFFFFFFF"

    ##########################################################################################
    # Configure MPAS baseline branch run directory.
    ##########################################################################################
    - name: Create and populate run directory -- baseline branch runs
      run: |
        set -x
        cd ${runner_ROOT} && mkdir run_bl && cd run_bl
        cp ${MPAS_ROOT}/${ufscmnty_cases}/ufscommunity.${{env.physics}}.${{matrix.ic_source}}.${{matrix.season}}/* .
        echo
        echo "AAAAAAAAAA"
        ls -alF ${mpas_bl_ROOT}/src/core_atmosphere/physics/physics_wrf/files/*.TBL
        echo "BBBBBBBBBB"
        ln -sf ${mpas_bl_ROOT}/src/core_atmosphere/physics/physics_wrf/files/*.TBL .
        ln -sf ${mpas_bl_ROOT}/src/core_atmosphere/physics/physics_wrf/files/*.DBL .
        ln -sf ${mpas_bl_ROOT}/src/core_atmosphere/physics/physics_wrf/files/*DATA .
        ln -sf ${mpas_bl_ROOT}/src/core_atmosphere/physics/physics_noahmp/parameters/NoahmpTable.TBL .
        ln -sf ${MPAS_ROOT}/src/core_atmosphere/physics/physics_noaa/TEMPO/tables/ccn_activate.bin .
        ln -sf ${MPAS_ROOT}/${mpas_ics}/ufscommunity.${{matrix.ic_source}}.${{matrix.season}}/mpas.init.nc .
        ln -sf ${MPAS_ROOT}/${mpas_ics}/ufscommunity.${{matrix.ic_source}}.${{matrix.season}}/mpas.ugwp_oro_data.nc .
        ln -sf ${MPAS_ROOT}/${mpas_ics}/ufscommunity.${{matrix.ic_source}}.${{matrix.season}}/mpas.lbc.nc .
        ln -sf ${MPAS_ROOT}/${mpas_ics}/ufscommunity.${{matrix.ic_source}}.${{matrix.season}}/graph.info.part.2 .
        ln -sf ${MPAS_ROOT}/${ufs_phys_tables}/tempo/* .
        ln -sf ${MPAS_ROOT}/${ufs_phys_tables}/ugw/* .
        ln -sf ${mpas_bl_ROOT}/atmosphere_model .

    - name: Link surface files to run directory -- baseline branch runs
      if: matrix.ic_source == 'gfs'
      run: |
        cd ${runner_ROOT}/run_bl
        ln -sf ${MPAS_ROOT}/${mpas_ics}/ufscommunity.${{matrix.ic_source}}.${{matrix.season}}/mpas.sfc_update.nc .

    ##########################################################################################
    # Configure MPAS feature branch run directory.
    ##########################################################################################
    - name: Create and populate run directory -- feature branch runs
      run: |
        set -x
        echo "AAAAAAAAAA"
        #echo "pwd = |$(pwd)|"
        cd ${runner_ROOT} && mkdir run_rt && cd run_rt
        cp ${MPAS_ROOT}/${ufscmnty_cases}/ufscommunity.${{env.physics}}.${{matrix.ic_source}}.${{matrix.season}}.stoch/* .
        # Create symlinks in the run directory.
        #
        # Links to WRF physics tables and other files that are downloaded during the call to
        # checkout_data_files.sh.
        ln -sf ${MPAS_ROOT}/${wrf_phys_tables}/{*.TBL,*.DBL,*.DATA} .
        # Links to UFS physics tables that are under version control, i.e. part of the MPAS-Model
        # repo or submodules.  These are not created in the build step or some other way.  They
        # are present once the repository is cloned (recursively).
        ln -sf ${MPAS_ROOT}/src/core_atmosphere/physics/physics_noahmp/parameters/NoahmpTable.TBL .
        ln -sf ${MPAS_ROOT}/src/core_atmosphere/physics/physics_noaa/TEMPO/tables/ccn_activate.bin .
        # Links to the UFS physics tables downloaded by the get_data.sh script.
        ln -sf ${MPAS_ROOT}/${ufs_phys_tables}/tempo/* .
        ln -sf ${MPAS_ROOT}/${ufs_phys_tables}/ugw/* .
        # Links to the MPAS initial and boundary condition files and other static files.
        ln -sf ${MPAS_ROOT}/${mpas_ics}/ufscommunity.${{matrix.ic_source}}.${{matrix.season}}/mpas.init.nc .
        ln -sf ${MPAS_ROOT}/${mpas_ics}/ufscommunity.${{matrix.ic_source}}.${{matrix.season}}/mpas.ugwp_oro_data.nc .
        ln -sf ${MPAS_ROOT}/${mpas_ics}/ufscommunity.${{matrix.ic_source}}.${{matrix.season}}/mpas.lbc.nc .
        ln -sf ${MPAS_ROOT}/${mpas_ics}/ufscommunity.${{matrix.ic_source}}.${{matrix.season}}/graph.info.part.2 .
        # Link to the MPAS executable.
        ln -sf ${MPAS_ROOT}/atmosphere_model .
        echo "BBBBBBBBBB"
        #echo "MPAS_ROOT = |${MPAS_ROOT}|"
        #cd ${MPAS_ROOT}
        echo "pwd = $(pwd)"
        ls -alF
        echo "CCCCCCCCCC"
        #cd ${MPAS_ROOT}/testing_and_setup/ufs-community/cases/ufscommunity.${{env.physics}}.${{matrix.ic_source}}.${{matrix.season}}.stoch
        #pwd
        #ls -alF
        #echo "DDDDDDDDDD"
        #more namelist.atmosphere
        # echo "EEEEEEEEEE"

    - name: Link surface files to run directory -- feature branch runs
      if: matrix.ic_source == 'gfs'
      run: |
        cd ${runner_ROOT}/run_rt
        ln -sf ${MPAS_ROOT}/${mpas_ics}/ufscommunity.${{matrix.ic_source}}.${{matrix.season}}/mpas.sfc_update.nc .

    ##########################################################################################
    # Run MPAS with both baseline and feature branches.
    ##########################################################################################
    - name: Run MPAS -- baseline branch
      continue-on-error: true
      run: |
        cd ${runner_ROOT}/run_bl
        pwd && ls -l
        mpiexec --allow-run-as-root -np 1 ./atmosphere_model || true
        pwd && ls -l
        echo
        echo "AAAAAAAAAA"
        more log.atmosphere.0000.err
        echo
        echo "BBBBBBBBBB"
        more log.atmosphere.0000.out

    - name: Run MPAS -- feature branch
      run: |
        cd ${runner_ROOT}/run_rt
        pwd && ls -l
        mpiexec --allow-run-as-root -np 1 ./atmosphere_model || true
        pwd && ls -l
        echo
        echo "AAAAAAAAAA"
        more log.atmosphere.0000.err
        echo
        echo "BBBBBBBBBB"
        more log.atmosphere.0000.out

    ##########################################################################################
    # Compare feature branch to baseline branch.
    ##########################################################################################
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3.2.0
      with:
        python-version: ${{env.py-version}}
        auto-update-conda: true
        auto-activate-base: false
        #environment-file: testing_and_setup/ufs-community/environment.yml
        environment-file: ${{env.ufs_community}}/environment.yml
        activate-environment: mpas-ci-env

    - name: Run comparison script
      run: |
        #cd ${MPAS_ROOT}/testing_and_setup/ufs-community
        cd ${MPAS_ROOT}/${ufs_community}
        # Note that if the baseline directory ${runner_ROOT}/run_bl doesn't exist, the
        # comparison script cmp_rt2bl.py will still report a success.  Not clear if this
        # is by design.
        ./cmp_rt2bl.py --dir_rt ${runner_ROOT}/run_rt --dir_bl ${runner_ROOT}/run_bl
#        set -x
#        echo "AAAAAAAAAA"
#        cd ${runner_ROOT}/run_rt
#        echo "pwd = $(pwd)"
#        ls -alF
#        echo "BBBBBBBBBB"
#        cd ${runner_ROOT}/run_bl
#        echo "pwd = $(pwd)"
#        ls -alF
#        echo "CCCCCCCCCC"

    ##########################################################################################
    # Save MPAS output and log files as GitHub Artifact.
    ##########################################################################################
    - name: Create GitHub artifact
      run: |
        cd ${runner_ROOT}
        mkdir artifact-${{matrix.f-compiler}}-${{matrix.build-type}}-${{matrix.ic_source}}-${{matrix.season}}-${{env.physics}}-stoch
        cd artifact-${{matrix.f-compiler}}-${{matrix.build-type}}-${{matrix.ic_source}}-${{matrix.season}}-${{env.physics}}-stoch
        mkdir data_bl && cd data_bl
        set -x
        echo "AAAAAAAAAA"
        cp ${runner_ROOT}/run_bl/log.atmosphere.*.out log.atmosphere.BL.out
        echo "BBBBBBBBBB"
        cp ${runner_ROOT}/run_bl/history.*.nc .
        cp ${runner_ROOT}/run_bl/diag.*.nc .
        cp ${runner_ROOT}/run_bl/namelist.atmosphere .
        cd ..
        mkdir data_rt && cd data_rt
        cp ${runner_ROOT}/run_rt/log.atmosphere.*.out log.atmosphere.RT.out
        cp ${runner_ROOT}/run_rt/history.*.nc .
        cp ${runner_ROOT}/run_rt/diag.*.nc .
        cp ${runner_ROOT}/run_rt/namelist.atmosphere .

    - name: Upload log files as GitHub Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mpas-baselines-${{matrix.f-compiler}}-${{matrix.build-type}}-${{matrix.ic_source}}-${{matrix.season}}-${{env.physics}}-stoch
        path: /__w/artifact-${{matrix.f-compiler}}-${{matrix.build-type}}-${{matrix.ic_source}}-${{matrix.season}}-${{env.physics}}-stoch
