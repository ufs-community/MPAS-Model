name: MPAS-A Base Images Build
run-name: CI Image Build for MPAS-A

on:
  push:
    branches:
      # Only build containers when pushing to noaa/develop
      - "noaa/develop"
  # Run by hand on a branch that changes docker/ (e.g. one opened as a pull request), so its CI
  # finds images built from its own Dockerfiles.
  workflow_dispatch:

# Each image is pushed as dustinswales/ufs-community-mpas-ci:<toolchain>-<docker tree>, where
# <docker tree> is the first 12 characters of the git tree hash of docker/ (git rev-parse
# HEAD:docker), so every version of the Dockerfiles has its own images; mpas_ci.yml uses the
# images that match its own docker/. Pushes to noaa/develop also update :<toolchain>.

jobs:
  docker:
    #if: github.repository == 'ufs-community/MPAS-Model'
    strategy:
      fail-fast: false  # Disable fail-fast
      matrix:
        toolchain:  [gnu, oneapi, nvhpc]
        include:
          # Set toolchain configuration(s)
          - toolchain: gnu
            nfversion: 4.6.2
            pnfversion: 1.14.1
          - toolchain: oneapi
            nfversion: 4.5.4
            pnfversion: 1.12.3
          - toolchain: nvhpc
            nfversion: 4.5.4
            pnfversion: 1.12.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Image tags
        id: tags
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          image=dustinswales/ufs-community-mpas-ci
          tree=$(git rev-parse HEAD:docker | cut -c1-12)
          {
            echo "tags<<EOF"
            echo "${image}:${TOOLCHAIN}-${tree}"
            [ "$GITHUB_REF" = refs/heads/noaa/develop ] && echo "${image}:${TOOLCHAIN}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Image tags: ${image}:${TOOLCHAIN}-${tree}$([ "$GITHUB_REF" = refs/heads/noaa/develop ] && echo " ${image}:${TOOLCHAIN}")"

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build minimal-toolchain:${{ matrix.toolchain }}
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile-${{ matrix.toolchain }}-minimal
          tags: minimal-toolchain:${{ matrix.toolchain }}

      - name: Build add-netcdf:${{ matrix.toolchain }}
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile-add-netcdf
          tags: add-netcdf:${{ matrix.toolchain }}
          build-args: |
            TOOLCHAIN=${{ matrix.toolchain }}
            NFVERSION=${{ matrix.nfversion }}

      - name: Build add-pnetcdf:${{ matrix.toolchain }}
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile-add-pnetcdf
          tags: add-pnetcdf:${{ matrix.toolchain }}
          build-args: |
            TOOLCHAIN=${{ matrix.toolchain }}
            PNFVERSION=${{ matrix.pnfversion }}

      - name: Build add-python:${{ matrix.toolchain }}
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile-add-python
          build-args: TOOLCHAIN=${{ matrix.toolchain }}
          tags: add-python:${{ matrix.toolchain }}

      - name: Build and push dustinswales/ufs-community-mpas-ci:${{ matrix.toolchain }}-<docker tree>
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile-finalize
          build-args: TOOLCHAIN=${{ matrix.toolchain }}
          push: True
          tags: ${{ steps.tags.outputs.tags }}
